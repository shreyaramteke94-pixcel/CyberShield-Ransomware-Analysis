<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cyber Shield | History</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="background-glow"></div>
    <div class="cyber-grid"></div>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            <div class="logo-icon">🛡️</div>

            <div>
                <strong>Cyber Shield</strong>
                <span>Security Center</span>
            </div>

        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="scanner.html">
                Scanner
            </a>

            <a href="history.html" class="active">
                History
            </a>

            <a href="index.html" class="logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- HISTORY -->

    <main class="container">

        <div class="page-heading history-heading">

            <div>

                <p class="small-label">
                    SECURITY RECORDS
                </p>

                <h1>
                    Scan History
                </h1>

                <p>
                    View your previous file scans.
                </p>

            </div>

            <button
                id="clearHistory"
                class="clear-btn"
            >
                🗑 Clear History
            </button>

        </div>


        <div class="history-card">

            <div class="history-header">

                <span>
                    FILE
                </span>

                <span>
                    DATE
                </span>

                <span>
                    STATUS
                </span>

            </div>

            <div id="historyList">

                <!-- JavaScript adds history here -->

            </div>

        </div>

    </main>


    <script src="js/history.js"></script>

</body>

</html>
